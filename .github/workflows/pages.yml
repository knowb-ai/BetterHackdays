name: Docs Site

# Publishes site/ to GitHub Pages at https://hack.knowb.run.
# The custom domain and HTTPS are set in the repository's Pages settings;
# see "Deploying this site" on the page itself.

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "app/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check generated reference is current
        run: python scripts/build_site.py --check
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
