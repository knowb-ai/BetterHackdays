name: Docs Site

# Builds the Zola site in site/ and publishes it to GitHub Pages at the
# custom domain https://hack.knowb.run.
# The custom domain and HTTPS are set in the repository's Pages settings;
# see "Deploying this site" on the page itself.

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "app/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ZOLA_VERSION: "0.22.1"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install Zola
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check generated reference is current
        run: python scripts/build_site.py --check
      - name: Test the docs site against a real build
        run: python -m unittest tests.test_docs_site -v
      - name: Build site
        run: zola --root site build
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
