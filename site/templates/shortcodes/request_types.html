{#- Contributor request types the connector accepts, from data/reference.json. -#}
{%- set ref = load_data(path="data/reference.json") -%}
<div class="table-wrap"><table class="ref-table req-table"><thead><tr><th scope="col">Request type</th><th scope="col">Use it to</th><th scope="col">Requester needs on BetterHackdays</th></tr></thead><tbody>{% for r in ref.request_types %}<tr id="request-{{ r.key }}" data-search="{{ r.label }} {{ r.key }}"><td><strong>{{ r.label }}</strong><br><code>{{ r.key }}</code></td><td>{{ r.purpose }}</td><td>{{ r.permission }}</td></tr>{% endfor %}</tbody></table></div>
